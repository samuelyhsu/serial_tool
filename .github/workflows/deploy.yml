name: Deploy

# 只在**打 tag 发布**时部署：由 release.yml 在发布成功之后调用（见那边的 deploy job），
# 外加一个手动入口用于补救（重跑、或把线上回滚到某个旧 tag）。手动触发同样只接受
# v* tag，从分支触发会在第一个 job（guard）就失败。
#
# 曾经是「推 main 即部署」。问题是线上站点跟着任意一次提交走，而 Release 里那份
# 离线包、商店里那版扩展是跟着 tag 走的 —— 三者各跑各的，出问题时连「线上现在
# 到底是哪一版」都说不清。现在四件事由同一个 tag 串起来。
#
# 代价是 main 上的提交不再自动上线，得打 tag。这是有意的取舍：这个工具是给别人
# 装到内网机器上用的，「线上=某个发布版本」比「线上=最新提交」重要得多。
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-verify:
        description: >-
          调用方自己已经跑过完整 CI 时传 true（release.yml 就是这么用的），
          免得同一条流水线把 typecheck / lint / 测试跑两遍。
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑。
# 不开 cancel-in-progress：部署现在只由发布触发，本来就稀少，而被取消的那次很可能
# 已经把扩展发上商店了 —— 留下「扩展发了、站点没更」的半截状态，比多等一会儿糟得多。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 线上只放发布版本：不管是被 release.yml 调用还是手动触发，要部署的 ref 都必须是
  # v* tag。手动入口在 Actions 页上可以选任意分支 —— 从 main 手动部署过一次，线上跑的
  # 就成了 v0.1.0 之后第 7 个提交，和 Release、商店里那版对不上。
  #
  # github-pages 环境的部署规则里也只放行 v* tag，这里再挡一道是因为：
  #  - 自建服务器那份不走任何环境，只有这里拦得住它；
  #  - 在最前面失败，而不是等整套 CI 跑完了才被环境规则拒掉。
  # 被调用时 github.ref 是调用方的，也就是触发 release.yml 的那个 tag。
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 只允许部署 v* tag
        env:
          # 经 env 传进脚本而不是直接拼进命令行：分支名是用户可控的字符串
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "部署 ${REF#refs/tags/}" ;;
            *)
              echo "::error::线上只部署发布版本。手动触发时请在 Use workflow from 里选一个 v* tag（当前：$REF）"
              exit 1
              ;;
          esac

  # 先把 CI 的校验（typecheck / lint / format / 测试）跑一遍，通过了才允许发布。
  # 打包器的验证交给下面的 build job —— 它用 BASE_PATH 构建的正是要发布的产物
  verify:
    needs: guard
    # 显式写出 workflow_dispatch，不依赖「inputs 未定义时 null 强转 false」这条隐晦规则：
    # 万一理解有偏差，手动部署会静默失去全部校验，而这种漏洞没人会察觉。
    # 没写状态函数时 GitHub 会隐式补上 success()：guard 失败，这里跟着跳过。
    if: ${{ github.event_name == 'workflow_dispatch' || !inputs.skip-verify }}
    uses: ./.github/workflows/ci.yml
    with:
      # 下面的 build job 马上会用 BASE_PATH 再构建一次，这里不必重复
      skip-build: true

  build:
    needs: [guard, verify]
    # verify 被 skip-verify 跳过时，依赖它的 job 会按默认规则一起跳过 —— 必须显式放行。
    # 用 !cancelled() 而不是 always()：整条流水线被人取消时不该还继续往线上推。
    # guard 要单独判：它失败时 verify 也是 skipped，而上一条规则恰恰把 skipped 当放行。
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 版本的唯一来源是 .nvmrc
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages 项目页部署在 /<repo>/ 子路径下
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement: 仓库尚未开启 Pages 时自动开启并把来源设为 GitHub Actions。
      # 没有它，首次部署会以「Get Pages site failed ... Not Found」失败 ——
      # 必须先手动到 Settings → Pages 里选一次来源才能跑通。
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 必须显式写：经 release.yml 调用时 verify 被 skip-verify 跳过，build 靠自己的 if 放行了，
    # 但不写 if 的 job 用的是默认的 success()，它会沿依赖链看到那个 skipped 的 verify，
    # 把这里也一并跳过（官方文档："a failure or skip applies to all jobs in the dependency
    # chain from the point of failure or skip onwards"；actions/runner#2205）——
    # 结果就是自建服务器更新了、Pages 却没更，而且整条流水线是绿的。
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 同一份代码再部署一份到自建服务器（serial.uplume.com）。
  #
  # 与 Pages 那份的唯一区别是 base 路径：自有域名就是站点根，不需要 /<repo>/ 前缀，
  # 所以这里用默认构建，不传 BASE_PATH。
  #
  # 主机 / 端口 / 用户都走 secrets 而不是写死在文件里：仓库是公开的，
  # 非标准 SSH 端口没必要主动登出去。没配密钥时整个 job 静默跳过，
  # fork 这个仓库的人不会因此一直看到红叉。
  self-hosted:
    needs: [guard, verify]
    # 与 build 同理：guard 失败时 verify 是 skipped，必须单独判 guard
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      # job 级只放「配没配」，密钥本身只交给真正用它的 Deploy 一步。
      # 下面的 npm ci 会执行依赖的 install 脚本 —— 把密钥放在 job 级，
      # 等于递给整棵依赖树里的每一段代码。
      HAS_SSH_KEY: ${{ secrets.SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_SSH_KEY == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_SSH_KEY == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: env.HAS_SSH_KEY == 'true'

      - name: Build
        if: env.HAS_SSH_KEY == 'true'
        run: npm run build

      # 不用第三方的 ssh-agent action：这点事几行 shell 就够，
      # 而部署密钥要经手的东西越少越好。
      - name: Deploy
        if: env.HAS_SSH_KEY == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          # 服务器端用 rrsync 把钥匙钉在站点目录上时，这里的路径相对那个目录（填 "."），
          # 见 docs/deploy/README.md
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 用固定的 known_hosts 校验主机指纹，而不是 StrictHostKeyChecking=no ——
          # 后者等于对中间人完全不设防
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delete 清掉上一版留下的、带旧哈希的资源文件
          rsync -az --delete --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Skipped
        if: env.HAS_SSH_KEY != 'true'
        run: echo "::notice::未配置 SSH_KEY，已跳过自建服务器部署。"
